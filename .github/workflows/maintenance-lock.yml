name: maintenance-lock

on:
  push:
    branches: [fix/rental-maintenance-recovery]
    paths:
      - 'backend/composer.json'
      - '.github/workflows/maintenance-lock.yml'

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rental-maintenance-recovery
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer update --with-all-dependencies --no-interaction --no-progress --no-scripts
        working-directory: backend
      - name: Commit updated lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar dependencias do backend"
            git push origin HEAD:fix/rental-maintenance-recovery
          fi
